name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -race -count=1
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o bin/aigatekeeper ./cmd/aigatekeeper
      - uses: actions/upload-artifact@v4
        with:
          name: aigatekeeper-linux-amd64
          path: bin/aigatekeeper

  smoke:
    name: Smoke test (binary)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aigatekeeper-linux-amd64
          path: bin
      - run: chmod +x bin/aigatekeeper
      - name: run smoke test
        run: scripts/smoke.sh bin/aigatekeeper

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: aigatekeeper:ci
          build-args: VERSION=${{ github.sha }}
      - name: container starts and reports healthy
        run: |
          mkdir -p certs
          docker run --rm -v "$PWD/certs:/certs" aigatekeeper:ci ca init --out /certs
          cid=$(docker run -d -v "$PWD/certs:/certs" -p 18080:8080 -p 19090:9090 aigatekeeper:ci)
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:19090/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:19090/readyz
          docker logs "$cid"
          docker rm -f "$cid"
