# AIGatekeeper configuration.
# Every field is optional except `services`; omitted fields take the defaults shown here.
# Sizes accept 8MiB / 32MB / 1024; durations accept 300ms / 12h / 397d.
version: 1

listen:
  forward: "0.0.0.0:8080"        # HTTP proxy: CONNECT for HTTPS, absolute-URI for plain HTTP
  admin: "127.0.0.1:9090"        # health, CA download, admin API and web UI
  reverse: []                    # reverse listeners for local model servers, e.g.
  # - { name: ollama, listen: "127.0.0.1:11434", upstream: "http://127.0.0.1:11435", service: ollama }

ca:
  cert: ../certs/ca.crt          # paths are relative to this file; generated by `aigatekeeper ca init`
  key: ../certs/ca.key
  leaf_ttl: 397d                 # per-host certificate lifetime (must stay under 398d)
  cache_size: 1024

tls:
  advertise_http2: false         # offer h2 to intercepted clients (HTTP/1.1 is universally accepted)
  upstream_extra_roots: []       # extra PEM roots for private upstreams
  upstream_insecure: false       # never enable outside a lab
  upstream_proxy: ""             # optional http://, https:// or socks5:// egress proxy

limits:
  max_body_bytes: 8MiB           # raw request body accepted for inspection
  max_decoded_bytes: 32MiB       # after decompression
  oversize_action: block         # block | allow
  parse_error_action: allow      # non-JSON or malformed bodies: allow | block
  upstream_timeout: 120s

mode:
  monitor: false                 # true = never block, only log what would have been blocked

reload:
  watch: true
  debounce: 300ms
  poll_interval: 0s              # set e.g. 5s on Docker Desktop bind mounts where inotify is unreliable

audit:
  stdout: true                   # one JSON line per transaction (ship to ELK/Splunk)
  file: ""
  include_preview: true          # masked preview of matched values, e.g. AKIA****Q7
  log_allowed: true
  # Records the prompt text itself, not just what was found in it. Useful
  # for a pilot on one machine; a liability across a company, because the
  # audit database then holds everything your developers type.
  capture_prompts: false
  max_prompt_bytes: 8KiB
  sqlite:                        # searchable history behind the admin UI (stdout logging is unaffected)
    enabled: false
    path: ../data/audit.db
    max_age: 720h                # delete events older than this
    max_rows: 1000000            # and keep at most this many
    batch_size: 256
    batch_interval: 200ms
    sweep_interval: 1h
    queue: 8192

admin:
  ui: true                       # serve the embedded web UI on the admin listener
  auth:
    # The admin API and UI stay disabled until one of these is set.
    # Generate a hash with: aigatekeeper admin hash-password
    password_hash: ""            # bcrypt; or set AIGK_ADMIN_PASSWORD_HASH
    token: ""                    # bearer token for scripting; or set AIGK_ADMIN_TOKEN
    session_ttl: 12h
    login_burst: 5               # login attempts allowed per client IP before throttling
    login_per_minute: 5
  tls_cert: ""                   # required if the admin listener is not on loopback
  tls_key: ""
  cors_origins: []               # e.g. ["http://localhost:5173"] for `npm run dev`

tunnel_unmatched: true           # hosts not listed below are tunnelled untouched (never decrypted)
default_action: block
block_message: "[AIGatekeeper] Request blocked by policy {rule} ({detectors}). Ref {request_id}."

services:
  - name: openai
    hosts: ['^api\.openai\.com$', '^.*\.openai\.azure\.com$']
    extractor: openai
    block_mode: reject
    rules: [secrets, pii, internal]

  - name: copilot
    hosts: ['^api\.githubcopilot\.com$', '^copilot-proxy\.githubusercontent\.com$', '^.*\.githubcopilot\.com$']
    extractor: copilot
    block_mode: synthetic        # fake completion so the IDE shows why instead of a generic error
    passthrough_paths: ['^/_ping$', '^/models$', '^/telemetry']
    rules: [secrets, pii, internal]

  - name: anthropic
    hosts: ['^api\.anthropic\.com$']
    extractor: anthropic
    block_mode: reject
    rules: [secrets, pii, internal]

  - name: gemini
    hosts: ['^generativelanguage\.googleapis\.com$']
    extractor: gemini
    block_mode: reject
    rules: [secrets, pii, internal]

  - name: tabnine
    hosts: ['^api\.tabnine\.com$']
    extractor: generic
    block_mode: reject
    rules: [secrets, internal]

  - name: ollama
    hosts: ['^(localhost|127\.0\.0\.1)$']   # normally reached via a reverse listener instead
    extractor: ollama
    block_mode: synthetic
    rules: [secrets]

rules:
  - id: secrets
    severity: critical
    action: block
    detectors: [access_keys, aws_secret_key, github_token, slack_token, google_api_key,
                openai_key, anthropic_key, jwt, private_key, high_entropy_secret]
    # access_keys matches an access key ID by its vendor prefix. It ships
    # with AWS, Alibaba and Tencent; uncomment to cover your own systems.
    # Replacing the list replaces the defaults, so repeat the ones you want.
    # options:
    #   access_keys:
    #     prefixes:
    #       - { prefix: AKIA, length: 16, note: AWS long-term }
    #       - { prefix: ASIA, length: 16, note: AWS temporary }
    #       - { prefix: CORP, note: our own gateway }   # no length: uses the range below
    #     min_length: 16
    #     max_length: 40

  - id: pii
    severity: high
    action: block
    detectors: [credit_card, us_ssn, iban]
    options:
      email: { enabled: false }  # email is noisy in source code; opt in per deployment

  - id: internal
    severity: medium
    action: monitor              # log only while tuning; switch to block when confident
    keywords:
      file: ./keywords.txt
      case_insensitive: true
      word_boundary: true
    regex:
      - { id: project_codename, pattern: '(?i)\bproject[- ]?(falcon|orion)\b' }

# Who a request is attributed to. All optional: with everything off, events
# carry a client address only, which is enough for a pilot but not for
# telling one developer from another on a shared subnet.
identity:
  proxy_auth:
    # Makes the proxy ask workstations for credentials (HTTP 407), which is
    # the only way to name a person rather than a machine. VS Code sends
    # them from http.proxy (http://alice@proxy:8080) or http.proxyAuthorization.
    enabled: false
    realm: AIGatekeeper
    backend: htpasswd            # htpasswd | ldap
    htpasswd: { file: ./users.htpasswd }   # bcrypt lines "user:$2a$..."
    ldap:
      url: "ldaps://dc.corp.local:636"
      bind_dn: ""                # service account used to find the user
      bind_password_env: AIGK_LDAP_BIND_PASSWORD
      base_dn: "OU=Users,DC=corp,DC=local"
      user_filter: "(sAMAccountName={user})"
      mail_attr: mail
      manager_attr: manager
    exempt_cidrs: []             # build agents and other automation
    cache_ttl: 5m
  reverse_dns: { enabled: true, cache_ttl: 10m, timeout: 500ms }
  directory: { csv: "" }         # user,email,manager_email; or `ldap: true`

# Tell someone when one person repeats violations. Nothing is sent unless a
# rule is defined here. Matched values are always masked in the message.
alerts:
  email:
    host: ""                     # e.g. smtp.corp.local
    port: 587
    tls: starttls                # starttls | tls | none
    username: ""
    password_env: AIGK_SMTP_PASSWORD
    from: aigatekeeper@corp.local
  webhooks: []
  # - { name: soc, url: "https://hooks.example/services/...", secret_env: AIGK_WEBHOOK_SECRET }
  rules: []
  # - id: repeat-offender
  #   match: { actions: [block], min_severity: high }
  #   group_by: user             # user | device | client_ip; falls back down the list
  #   threshold: 3
  #   window: 24h
  #   cooldown: 24h              # at most one message per person per day
  #   notify:
  #     - { type: email, to: [security@corp.local] }
  #     - { type: email, to_manager: true }    # needs identity.directory
  #     - { type: email, to_user: false }      # emailing the person is employee
  #                                            # monitoring; check it is allowed first
  #     - { type: webhook, name: soc }

allowlist:
  values:                        # never flag these literal strings
    - AKIAIOSFODNN7EXAMPLE
    - "4111111111111111"
  patterns:
    - '(?i)\bexample\b.{0,20}(key|token)'
  email_domains: [example.com]
  client_cidrs: []               # sources that bypass DLP entirely (e.g. CI runners)
  header_bypass: { name: X-AIGK-Bypass, token: "" }   # empty token = disabled
  segment_paths: ['/tools/*/input_schema/**']         # JSON paths never scanned (tool schemas)
